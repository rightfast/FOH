name: FOH
options:
  bundleIdPrefix: studio.rightfast
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  FOH:
    type: application
    platform: macOS
    sources:
      - path: FOH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.rightfast.foh
        PRODUCT_NAME: FOH
        INFOPLIST_KEY_CFBundleDisplayName: FOH
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Right Fast Studio"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: FOH/FOH.entitlements
    scheme:
      testTargets:
        - FOHTests
  FOHTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FOHTests
    dependencies:
      - target: FOH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.rightfast.foh.tests
        GENERATE_INFOPLIST_FILE: YES
