name: Publish Test Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Test build version tag
        required: true
        default: v0.2.0-rc.4

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Run unit tests
        run: |
          xcodegen generate
          xcodebuild test -project FOH.xcodeproj -scheme FOH -destination 'platform=macOS'

      - name: Build universal preview DMG
        run: Scripts/build-release.sh --adhoc --skip-notarization

      - name: Verify preview artifacts
        run: |
          hdiutil verify build/release/FOH.dmg
          (cd build/release && shasum -a 256 -c FOH.dmg.sha256)
          codesign --verify --deep --strict build/release/FOH.xcarchive/Products/Applications/FOH.app
          install_check="$RUNNER_TEMP/foh-install-check"
          mkdir -p "$install_check"
          device="$(hdiutil attach build/release/FOH.dmg -nobrowse -readonly | awk '/Apple_HFS/ {print $1; exit}')"
          ditto /Volumes/FOH/FOH.app "$install_check/FOH.app"
          codesign --verify --deep --strict --verbose=2 "$install_check/FOH.app"
          hdiutil detach "$device"

      - name: Create or update numbered preview release
        run: |
          release_name="${RELEASE_TAG#v}"
          release_name="${release_name/-preview./ Preview }"
          release_name="${release_name/-rc./ RC }"
          release_title="FOH $release_name"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --prerelease \
              --notes "Release candidate for hands-on testing. Refines the Signal Desk interface with a cleaner onboarding wordmark, consistently aligned settings controls, a precise Scene form grid, clearer Scene actions, and a Finder-safe DMG layout. Universal for Apple Silicon and Intel. This build is not Developer ID signed or notarized; follow the README first-launch instructions."
          else
            gh release edit "$RELEASE_TAG" \
              --title "$release_title" \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            build/release/FOH.dmg \
            build/release/FOH.dmg.sha256 \
            --clobber
