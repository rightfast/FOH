name: Publish Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Build universal preview DMG
        run: Scripts/build-release.sh --adhoc --skip-notarization

      - name: Verify preview artifacts
        run: |
          hdiutil verify build/release/FOH.dmg
          (cd build/release && shasum -a 256 -c FOH.dmg.sha256)
          codesign --verify --deep --strict build/release/FOH.xcarchive/Products/Applications/FOH.app

      - name: Create or update rolling preview release
        run: |
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview \
              --target "$GITHUB_SHA" \
              --title "FOH Preview" \
              --prerelease \
              --notes "Universal Apple Silicon and Intel test build. This preview is not Developer ID signed or notarized. Follow the README first-launch instructions and verify the published SHA-256 checksum."
          fi
          gh release upload preview \
            build/release/FOH.dmg \
            build/release/FOH.dmg.sha256 \
            --clobber

